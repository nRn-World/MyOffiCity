name: MyOffiCity Agent Check

on:
  push:
    branches:
      - main
      - 'myofficity/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-agent-work:
    name: Verify Agent Commit & Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check JavaScript & Python files
        run: |
          set -e
          for f in app.js office.js cityassets.js local-ai-bridge.js market/src/index.js market/public/portal.js market/public/office.js market/public/cityassets.js market/public/agent-addons.js; do
            if [ -f "$f" ]; then
              echo "Checking $f..."
              node --check "$f"
            fi
          done
          if [ -f server.py ]; then
            echo "Checking server.py..."
            python3 -m py_compile server.py
          fi

      - name: Run regression tests
        run: |
          node --test test/regressions.test.js

      - name: Auto-merge verified MyOffiCity agent PR
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'myofficity/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          echo "All checks passed! Auto-merging PR #${PR_NUM} from ${GITHUB_HEAD_REF}..."
          gh pr merge "$PR_NUM" --merge --admin || gh pr merge "$PR_NUM" --merge

      - name: Auto-deploy to Cloudflare Workers (on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: market
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 27a74e9d7a70fc37add3269ef595ef46
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN saknas i GitHub Secrets – hoppar över auto-deploy."
            exit 0
          fi
          npx --yes wrangler deploy

      - name: Write Agent Activity Summary
        if: always()
        run: |
          {
            echo "## 🤖 MyOffiCity Agent Update"
            echo "- **Branch:** \`${GITHUB_REF_NAME}\`"
            echo "- **Commit:** \`${GITHUB_SHA::7}\` — $(git log -1 --pretty=%s)"
            echo "- **Author:** $(git log -1 --pretty='%an')"
            echo "- **Time (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "### Changed files"
            echo '```'
            git diff-tree --no-commit-id --name-status -r HEAD || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
